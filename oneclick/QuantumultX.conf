# ============================================================
#  QuantumultX 一键配置：分流 + 去广告 + App 开屏广告拦截
#
#  不需要 Node.js，不需要 clone 仓库，不需要跑任何命令。
#
#  用法：
#    1. 复制这个文件的全部内容；
#    2. 把下面 [server_remote] 里那一行的 URL 换成【你自己机场的订阅链接】；
#       —— 整份配置你只需要改这一处；
#    3. 存成一个 .conf 文件放到能被访问的地址（iCloud / 私有 Gist / 任意直链），
#       在 QuantumultX 里「设置 → 配置 → 从 URL 引用」填该地址即可。
#       （也可以直接编辑 QX 内置配置，把内容粘进去。）
#
#  节点从哪来：QX 自己去拉你机场的订阅，本文件不含任何节点。
#  策略组怎么自动分区：靠 server-tag-regex 按节点名匹配，不写死节点名，
#                      所以换机场、机场加减节点都不用改这份配置。
#  规则怎么更新：所有规则都是远程订阅，QX 每天自动拉最新，不用你管。
#
#  ⚠️ 开屏广告拦截需要 MITM，必须额外做三步，见文件末尾 [mitm] 段的说明。
# ============================================================

[general]
server_check_url=http://cp.cloudflare.com/generate_204
geo_location_checker=disabled
running_mode_trigger=filter

[dns]
server=223.5.5.5
server=223.6.6.6

# ------------------------------------------------------------
#  ↓↓↓ 唯一需要你修改的地方：换成你自己机场的订阅链接 ↓↓↓
#  （机场后台复制的那条链接，Clash / 通用订阅格式都行）
# ------------------------------------------------------------
[server_remote]
https://把这里替换成你自己机场的订阅链接, tag=我的机场, update-interval=86400, opt-parser=false, enabled=true

[server_local]

[policy]
static=🎯全球直连, DIRECT
static=🛑全球拦截, REJECT

# 自动测速选最快的节点
url-latency-benchmark=♻️自动选择, server-tag-regex=.*, check-interval=600, tolerance=100
# 想手动指定某一个具体节点时用这个组
static=🎈手动切换, server-tag-regex=.*

# 地区分组：按节点名字自动归类，不写死节点名，换机场也不用改
available=🇭🇰香港节点, server-tag-regex=(?i)(香港|港|HK|Hong ?Kong|🇭🇰)
available=🇺🇸美国节点, server-tag-regex=(?i)(美国|美|US|United ?States|🇺🇸)
available=🇹🇼台湾节点, server-tag-regex=(?i)(台湾|台灣|台|TW|Taiwan|🇹🇼)
available=🇯🇵日本节点, server-tag-regex=(?i)(日本|日|JP|Japan|东京|大阪|🇯🇵)
available=🇸🇬新加坡节点, server-tag-regex=(?i)(新加坡|狮城|獅城|SG|Singapore|🇸🇬)

# 总开关：平时改这个组就行
static=🔰节点选择, ♻️自动选择, 🎈手动切换, 🇭🇰香港节点, 🇺🇸美国节点, 🇹🇼台湾节点, 🇯🇵日本节点, 🇸🇬新加坡节点, 🎯全球直连

# 分场景策略组
static=🇨🇳大陆网站, 🎯全球直连, 🔰节点选择
static=📢广告链接, 🛑全球拦截, 🎯全球直连
static=🤖AIPlatforms, 🇺🇸美国节点, 🇹🇼台湾节点, 🇯🇵日本节点, 🇸🇬新加坡节点, 🔰节点选择
static=👨‍🔬学术网站, 🔰节点选择, 🇭🇰香港节点, 🇺🇸美国节点, 🇯🇵日本节点, 🎯全球直连
static=🟦Microsoft服务, 🎯全球直连, 🔰节点选择, 🇭🇰香港节点, 🇺🇸美国节点, 🇯🇵日本节点
static=📺YouTube视频, 🔰节点选择, 🇭🇰香港节点, 🇺🇸美国节点, 🇹🇼台湾节点, 🇯🇵日本节点, 🇸🇬新加坡节点
static=🍎Apple服务, 🎯全球直连, 🔰节点选择, 🇭🇰香港节点, 🇺🇸美国节点, 🇯🇵日本节点
static=🐟无匹配规则, 🔰节点选择, 🎯全球直连, 🛑全球拦截

[filter_remote]
# ---------- 去广告 · 第一层：域名级（不需要证书，零风险）----------
# 中文 App / 小程序广告域名。规则自带 reject 策略，所以不设 force-policy。
https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/filter/filter.list, tag=去广告-域名@奶思, update-interval=86400, opt-parser=false, enabled=true
# 通用广告域名黑名单，统一交给 📢广告链接（想临时放行就在 QX 里把该组切成直连）。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/AdvertisingLite/AdvertisingLite.list, tag=去广告-域名@bm7, force-policy=📢广告链接, update-interval=86400, opt-parser=false, enabled=true

# ---------- 分流规则 ----------
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/OpenAI/OpenAI.list, tag=OpenAI, force-policy=🤖AIPlatforms, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Claude/Claude.list, tag=Claude, force-policy=🤖AIPlatforms, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Gemini/Gemini.list, tag=Gemini, force-policy=🤖AIPlatforms, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube, force-policy=📺YouTube视频, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTubeMusic/YouTubeMusic.list, tag=YouTubeMusic, force-policy=📺YouTube视频, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/GlobalScholar/GlobalScholar.list, tag=学术网站, force-policy=👨‍🔬学术网站, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Docker/Docker.list, tag=Docker, force-policy=👨‍🔬学术网站, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/OneDrive/OneDrive.list, tag=OneDrive, force-policy=🟦Microsoft服务, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Microsoft/Microsoft.list, tag=Microsoft, force-policy=🟦Microsoft服务, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Apple/Apple.list, tag=Apple, force-policy=🍎Apple服务, update-interval=86400, opt-parser=false, enabled=true
# 国内网站直连（放在最后，避免抢在上面的规则前面命中）
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/China/China.list, tag=大陆域名, force-policy=🇨🇳大陆网站, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaIPs/ChinaIPs.list, tag=大陆IP, force-policy=🇨🇳大陆网站, update-interval=86400, opt-parser=false, enabled=true

[filter_local]
host-suffix, local, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 100.64.0.0/10, direct
geoip, cn, 🇨🇳大陆网站
final, 🐟无匹配规则

[rewrite_remote]
# ---------- 去广告 · 第二层：开屏广告（需要 MITM，见下面 [mitm] 说明）----------
# 约 730 款 App / 小程序，其中 150+ 个带明确的开屏广告规则。
https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/rewrite.snippet, tag=开屏广告拦截@奶思, update-interval=86400, opt-parser=false, enabled=true
# App 净化合集：去掉冗余模块/浮窗。上游标注「遇到异常时关闭」，默认关，需要再改成 true。
https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/cleanup.snippet, tag=App净化@奶思, update-interval=86400, opt-parser=false, enabled=false

[rewrite_local]

[task_local]

[mitm]
# ============================================================
#  开屏广告拦截要生效，必须做这三步，缺一步都不会有效果：
#    1. QX → 设置 → MITM → 生成证书 → 安装；
#    2. iOS 设置 → 通用 → 关于本机 → 证书信任设置 → 打开对该证书的信任；
#       （最容易漏的一步，漏了 MITM 完全不工作）
#    3. 对想去广告的 App 清缓存或卸载重装一次
#       （开屏图是 App 提前缓存在本地的，不清的话看到的还是旧广告）。
#
#  下面这些域名【永不解密】。银行 / 支付类 App 普遍做了证书固定，
#  一旦被解密会直接登录失败或打不开，所以默认全部排除
#  —— 代价是这些 App 的广告也拦不掉。
#  如果你发现某个 App 装了这份配置后打不开，把它的域名照下面格式加进来即可。
# ============================================================
hostname = -*.alipay.com, -*.alipayobjects.com, -*.tenpay.com, -*.unionpay.com, -*.95516.com, -*.icbc.com.cn, -*.ccb.com, -*.abchina.com, -*.boc.cn, -*.bankcomm.com, -*.cmbchina.com, -*.psbc.com, -*.apple.com, -*.icloud.com, -*.mzstatic.com
